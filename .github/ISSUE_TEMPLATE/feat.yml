name: Feature
description: Propose a new capability
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please read [CONTRIBUTING.md](https://github.com/IMustafaZeynali/IResultPattern/blob/main/CONTRIBUTING.md) before submitting.
        Title format: `feat: <Imperative summary>`
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: 1–3 sentences — what and why
      placeholder: What capability is missing and why it matters
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Current limitation; include a short code sample if useful
      placeholder: What you cannot do today
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed change
      description: Actionable bullets; note tests or breaking changes if needed
      placeholder: |
        - ...
        - ...
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High — major usability gap
        - Medium — useful improvement
        - Low — nice to have
    validations:
      required: true
