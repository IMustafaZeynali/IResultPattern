name: Refactor / API design
description: Suggest an API or design change without a new feature
title: "refactor: "
labels: ["refactor"]
body:
  - type: markdown
    attributes:
      value: |
        Please read [CONTRIBUTING.md](https://github.com/IMustafaZeynali/IResultPattern/blob/main/CONTRIBUTING.md) before submitting.
        Title format: `refactor: <Imperative summary>`
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: 1–3 sentences — what and why
      placeholder: What design/API change is needed
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Current design issue; include a short code sample if useful
      placeholder: Why the current API/design is awkward or incorrect
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed change
      description: Actionable bullets; note breaking changes and tests if needed
      placeholder: |
        - ...
        - ...
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High — important design correctness
        - Medium — naming/API clarity
        - Low — non-urgent cleanup
    validations:
      required: true
